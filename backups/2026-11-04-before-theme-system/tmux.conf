# remap Ctrl-b to Ctrl-a
set-option -g prefix C-a
set-option -g prefix2 None

# set vim-like copy mode
setw -g mode-keys vi
bind -n F2 copy-mode
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -Tcopy-mode-vi 'C-V' send -X rectangle-toggle
unbind p
bind p run-shell "tmux set-buffer \"$(xclip -o)\"; tmux paste-buffer"

# key bindings for moving over panes
# binding to arrows for normal people
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D
# binded to yuio for vim people
bind-key -n M-y select-pane -L
bind-key -n M-o select-pane -R
bind-key -n M-i select-pane -U
bind-key -n M-u select-pane -D

# the new key bindings for splitting, CTRL-9 ( like CTRL-( ) for vertical, CTRL-0 ( like CTRL-) ) for horizontal
bind -n C-9 split-window -v -c "#{pane_current_path}"
bind -n C-0 split-window -h -c "#{pane_current_path}"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

# new window
bind -n C-t new-window -a -c "#{pane_current_path}"

# next pane
bind -n M-u next
bind -n S-Right next

# previous pane
bind -n M-i prev
bind -n S-Left prev

# make delay shorter
set -sg escape-time 0

# Toggle synchronize-panes with ^S m
bind s \
    set synchronize-panes \;\
    display "Sync #{?synchronize-panes,ON,OFF}"

set-option -g assume-paste-time 1
set-option -g default-command ""
set-option -g destroy-unattached off
set-option -g detach-on-destroy on
set-option -g display-panes-time 1000
set-option -g display-time 750
set-option -g history-limit 5000
set-option -g key-table "root"
set-option -g lock-after-time 0
set-option -g lock-command "lock -np"
set-option -g renumber-windows on
set-option -g repeat-time 500
set-option -g set-titles off
set-option -g set-titles-string "#S:#I:#W - "#T" #{session_alerts}"
set-option -g status on
set-option -g status-keys vi
set-option -g status-position bottom
set-option -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-option -g word-separators " -_@"
set-option -g aggressive-resize on
set-window-option -g allow-rename off
set-window-option -g automatic-rename off

set-option -g pane-border-lines double
set-option -g pane-border-indicators arrows
set-option -g pane-border-status top

# quiet
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none
set-option -g default-shell /usr/bin/zsh
bind-key k menu -x R -t 0 "-T Kill the session?" "Select this menu item and hit enter!" 9 'split-window; send-keys "sleep 1; pwd >> /tmp/tmux_restore_path.txt; tmux list-panes -s -F \"#\{pane_pid\} #\{pane_current_command\}\" | grep -v tmux | cut -d\" \" -f1 | while read in; do killProcessRecursive \$in; done" C-m exit C-m'


# ─── Theme: same palette as waybar (~/.config/waybar/theme.css) ─────────────
# true colour for foot/kitty (takes effect after re-attaching the client)
set -as terminal-features ",foot*:RGB,xterm-kitty:RGB,xterm-256color:RGB"

set -g @wb_bg     "#607b8f"   # @background  – pill background
set -g @wb_fg     "#f7e396"   # @foreground1 – text
set -g @wb_accent "#e97f4a"   # @foreground2 – active workspace
set -g @wb_fade   "#1e3017"   # @fade        – inactive workspace text
set -g @wb_warn   "#ffffa5"   # @bryellow
set -g @wb_black  "#21222c"

set -g status-interval 5
set -g status-style "bg=default,fg=#f7e396"   # transparent like waybar
set -g status-justify absolute-centre          # windows in the middle, like workspaces
set -g status-left-length 60
set -g status-right-length 80

# left: session pill (turns orange while prefix is held) + COPY / SYNC badges
#  /  = rounded pill caps (Nerd Font), same shape as waybar's border-radius
set -g status-left "#{?client_prefix,#[fg=#{@wb_accent} bg=default],#[fg=#{@wb_bg} bg=default]}#{?client_prefix,#[fg=#{@wb_fg} bg=#{@wb_accent}],#[fg=#{@wb_fg} bg=#{@wb_bg}]} #S#{?client_prefix,#[fg=#{@wb_accent} bg=default],#[fg=#{@wb_bg} bg=default]}#[default]#{?pane_in_mode, #[fg=#{@wb_bg}]#[fg=#{@wb_fg} bg=#{@wb_bg}]COPY#[fg=#{@wb_bg} bg=default],}#{?synchronize-panes, #[fg=#{@wb_warn}]#[fg=#{@wb_black} bg=#{@wb_warn} bold]SYNC#[fg=#{@wb_warn} bg=default nobold],}"

# centre: windows as one pill, active one highlighted inside it
set -g window-status-separator ""
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-format "#{?window_start_flag,#[fg=#{@wb_bg} bg=default],}#[fg=#{@wb_fade} bg=#{@wb_bg}]  #I #W#{?window_zoomed_flag, ,}  #{?window_end_flag,#[fg=#{@wb_bg} bg=default],}"
set -g window-status-current-format "#{?window_start_flag,#[fg=#{@wb_bg} bg=default],}#[fg=#{@wb_accent} bg=#{@wb_bg}]#[fg=#{@wb_fg} bg=#{@wb_accent} bold] #I #W#{?window_zoomed_flag, ,} #[fg=#{@wb_accent} bg=#{@wb_bg} nobold]#{?window_end_flag,#[fg=#{@wb_bg} bg=default],}"

# right: host pill
set -g status-right "#[fg=#{@wb_bg} bg=default]#[fg=#{@wb_fg} bg=#{@wb_bg}] #h#[fg=#{@wb_bg} bg=default]"

# panes, messages, copy mode
set -g pane-border-style "fg=#607b8f"
set -g pane-active-border-style "fg=#e97f4a,bold"
set -g pane-border-format "#{?pane_active,#[fg=#{@wb_fg} bg=#{@wb_accent} bold],#[fg=#{@wb_fade} bg=#{@wb_bg}]} #P  #{pane_current_command} #[default]"
set -g message-style "fg=#f7e396,bg=#607b8f"
set -g message-command-style "fg=#f7e396,bg=#e97f4a"
set -g mode-style "fg=#21222c,bg=#e97f4a"
set -g display-panes-active-colour "#e97f4a"
set -g display-panes-colour "#607b8f"
set -g clock-mode-colour "#e97f4a"
