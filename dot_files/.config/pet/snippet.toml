[[Snippets]]
  Description = "Compression of mp4 video. Adjustable parameter by number N=20-34. The larger the number, the more compressed video output is."
  Output = ""
  Tag = []
  command = "ffmpeg -i input.mp4 -vcodec libx265 -crf 28 output.mp4"

